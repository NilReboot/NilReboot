name: Update README ⭐
on:
  schedule:
    - cron: "0 0 * * *"  # Once a day
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: k2bd/advent-readme-stars@v1.0.3
        with:
          userId: 2735709
          sessionCookie: ${{ secrets.AOC_SESSION }}
          headerPrefix: '###'
      - uses: stefanzweifel/git-auto-commit-action@v5 # use v5
        with:
          commit_message: Update README stars
